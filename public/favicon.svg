<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Inner Soft Glow Border -->
  <rect x="44" y="44" width="424" height="424" rx="116" fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-opacity="0.35" />

  <!-- AK Stylized Text -->
  <text x="256" y="315" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" 
        font-weight="900" 
        font-size="210" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="-8"
        filter="url(#glow)">AK</text>
</svg>